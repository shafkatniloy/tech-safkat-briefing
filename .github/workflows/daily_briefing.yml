name: Daily Tech-Safkat Facebook Briefing

on:
  schedule:
    # 03:00 UTC = 09:00 AM Asia/Dhaka time every day
    - cron: '0 3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: read

jobs:
  run-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tech-Safkat Briefing Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ZAPIER_WEBHOOK_URL: ${{ secrets.ZAPIER_WEBHOOK_URL }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID || '1228167307048422' }}
        run: |
          python main.py

      - name: Upload Generated Photocard Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tech-safkat-photocard
          path: output/tech_safkat_card.jpg
          retention-days: 7
